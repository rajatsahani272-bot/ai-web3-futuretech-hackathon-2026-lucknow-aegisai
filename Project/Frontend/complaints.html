<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Complaints | FixMyCity</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">

    <div class="logo">
        Fix<span>MyCity</span>
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="report.html">Report Issue</a>
        <a href="complaints.html">My Complaints</a>
    </div>

</nav>

<div class="page-container">

    <div class="page-heading">
        <span class="badge">📋 Dashboard</span>
        <h1>My Complaints</h1>
        <p>Track all your reported civic issues.</p>
    </div>

    <div
        class="complaint-list"
        id="complaintList"
    >
        <p>Loading complaints...</p>
    </div>

</div>

<script src="js/script.js"></script>

<script>

async function getLocationName(latitude, longitude) {

    if (
        latitude === undefined ||
        longitude === undefined ||
        latitude === null ||
        longitude === null
    ) {
        return "Location unavailable";
    }

    try {

        const response = await fetch(
            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=18&addressdetails=1`,
            {
                headers: {
                    "Accept": "application/json"
                }
            }
        );

        if (!response.ok) {
            throw new Error("Location request failed");
        }

        const data = await response.json();

        const address = data.address || {};

        const locationName =
            address.road ||
            address.neighbourhood ||
            address.suburb ||
            address.village ||
            address.town ||
            address.city ||
            data.display_name;

        return locationName || "Location unavailable";

    } catch (error) {

        console.error(
            "Failed to get location name:",
            error
        );

        return "Location unavailable";
    }
}


document.addEventListener(
    "DOMContentLoaded",
    async function () {

        const complaintList =
            document.getElementById(
                "complaintList"
            );

        const complaints =
            await getMyComplaints();

        if (
            !complaints ||
            complaints.length === 0
        ) {

            complaintList.innerHTML = `
                <div class="complaint-card">

                    <div class="complaint-info">

                        <h2>No Complaints Found</h2>

                        <p>
                            You have not submitted
                            any complaints yet.
                        </p>

                    </div>

                </div>
            `;

            return;
        }


        complaintList.innerHTML =
            complaints.map(function (complaint) {

                const date =
                    complaint.createdAt
                        ? new Date(
                            complaint.createdAt
                        ).toLocaleDateString(
                            "en-IN",
                            {
                                day: "numeric",
                                month: "long",
                                year: "numeric"
                            }
                        )
                        : "Date unavailable";


                const status =
                    complaint.status ||
                    "pending";


                const statusClass =
                    status
                        .toLowerCase()
                        .replace(/\s+/g, "-");


                return `
                    <div
                        class="complaint-card"
                        data-id="${complaint._id}"
                    >

                        <div class="complaint-info">

                            <span class="complaint-id">
                                #${complaint._id}
                            </span>

                            <h2>
                                ${
                                    complaint.title ||
                                    "Untitled Complaint"
                                }
                            </h2>

                            <p>
                                📂
                                ${
                                    complaint.category ||
                                    "Other"
                                }
                            </p>

                            <p
                                class="complaint-location"
                                data-lat="${
                                    complaint.location?.latitude
                                }"
                                data-lng="${
                                    complaint.location?.longitude
                                }"
                            >
                                📍 Finding location...
                            </p>

                            <p>
                                📅 ${date}
                            </p>

                        </div>


                        <div
                            class="status ${statusClass}"
                        >
                            ${status}
                        </div>


                        <a
                            href="details.html?id=${complaint._id}"
                            class="track-btn"
                        >
                            Track →
                        </a>

                    </div>
                `;

            }).join("");


        const locationElements =
            document.querySelectorAll(
                ".complaint-location"
            );


        for (
            const element of locationElements
        ) {

            const latitude =
                element.dataset.lat;

            const longitude =
                element.dataset.lng;


            if (
                !latitude ||
                !longitude
            ) {

                element.innerText =
                    "📍 Location unavailable";

                continue;
            }


            const locationName =
                await getLocationName(
                    latitude,
                    longitude
                );


            element.innerText =
                `📍 ${locationName}`;
        }

    }
);

</script>

</body>
</html>
